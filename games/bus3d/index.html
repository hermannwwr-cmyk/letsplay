<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Bus Captain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f9e8c8; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  /* safe areas: the hub's frame gets no env() insets, so on phones held sideways main.js sets --padx to keep
     buttons clear of the notch */
  :root { --padx: 0px; --sl: max(12px, env(safe-area-inset-left), var(--padx)); --sr: max(12px, env(safe-area-inset-right), var(--padx));
    --st: max(10px, env(safe-area-inset-top)); --sb: max(14px, env(safe-area-inset-bottom)); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
</style>
<meta name="theme-color" content="#3fae49">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<!-- bus types (BB.fleet); optional: the game works without it -->
<script src="js/fleet.js"></script>
<script src="js/world.js"></script>
<script src="js/bus.js"></script>
<script src="js/jobs.js"></script>
<script src="js/depot.js"></script>
<script src="js/ui.js"></script>
<!-- playing together (the family room): PeerJS (MIT, vendored) and our room code; optional, the game works without them -->
<script src="vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
