# Deployed by Cloudflare Workers Builds from this folder (deploy command: npx wrangler deploy).
name = "bus-captain-rooms"
main = "worker.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The shared play-time settings channel (/family/all), one Durable Object that keeps every device's settings.
[[durable_objects.bindings]]
name = "FAMILY"
class_name = "Family"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Family"]

[vars]
# Pages that may connect: the app, the private claude.ai copies and file:// (null). "*" allows any.
ALLOWED_ORIGINS = "https://hermannwwr-cmyk.github.io,null"
# The grown-ups' admin PIN for the shared play-time settings (/family/all). It is also in the app's public code
# (index.html, ADMIN_PIN), so it keeps children out, not a determined adult. Change both together.
ADMIN_PIN = "8888"
